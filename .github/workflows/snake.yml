# Gera a animacao da cobrinha comendo o grafo de contribuicoes e publica os
# SVGs na branch "output", referenciados pelo README via raw.githubusercontent.
name: Gera animacao da cobrinha

on:
  schedule:
    - cron: '0 3 * * *' # todo dia, 00:00 em Brasilia
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Gera os SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LeonardoHGB
          outputs: |
            dist/snake.svg?color_snake=#1F6FEB&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/snake-dark.svg?palette=github-dark&color_snake=#58A6FF

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}